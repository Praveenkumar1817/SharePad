services:
  - type: web
    name: sharepad
    env: docker
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/me
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sharepad-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sharepad-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sharepad-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sharepad-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: sharepad-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false  # Set this AFTER deploy to your Vercel URL e.g. https://sharepad-nu.vercel.app

databases:
  - name: sharepad-db
    plan: free
    region: oregon
